[package]
name = "opifex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Public Rust library for the Opifex MQTT client and broker"

[lib]
name = "opifex"
path = "src/lib.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
opifex-protocol = { path = "../opifex-protocol" }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.38", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "time"] }

[features]
default = []
