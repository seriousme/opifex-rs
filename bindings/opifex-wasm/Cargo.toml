[package]
name = "opifex-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Optional browser client binding for Opifex using WebSockets"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
opifex-protocol = { path = "../../crates/opifex-protocol" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "BinaryType",
  "MessageEvent",
  "WebSocket",
] }

[workspace]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
